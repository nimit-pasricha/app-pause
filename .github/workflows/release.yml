name: Release

# Every merge to main publishes a downloadable APK to the Releases page.
on:
  push:
    branches: [main]

permissions:
  contents: write # needed to create the GitHub Release

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: if these secrets are set, the APK is signed with a stable
      # release key so it updates in place. If not, the build falls back to a
      # debug signature — still installable, just not update-in-place.
      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets set — building a debug-signed APK."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and assemble release
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.configured == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "beat-1.0.${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Beat 1.0.${{ github.run_number }}
          files: beat-1.0.${{ github.run_number }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
